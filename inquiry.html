<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>お問い合わせ - 期末課題</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
  <link rel="stylesheet" href="./css/inquiry.css">
</head>
<body class="sub-page">

  <main class="content-main">
    <h1 class="page-title">お問い合わせ</h1>

    <section class="contact-section">
      <form action="#" method="post" class="contact-form">
        
        <!-- お名前 -->
        <div class="form-group">
          <label for="name">お名前 <span class="required">必須</span></label>
          <input type="text" id="name" name="name" placeholder="京都 太郎" required>
        </div>

        <!-- メールアドレス -->
        <div class="form-group">
          <label for="email">メールアドレス <span class="required">必須</span></label>
          <input type="email" id="email" name="email" placeholder="example@email.com" required>
        </div>

        <!-- お問い合わせ内容 -->
        <div class="form-group">
          <label for="message">お問い合わせ内容 <span class="required">必須</span></label>
          <textarea id="message" name="message" rows="6" placeholder="メッセージを入力してください" required></textarea>
        </div>

        <!-- 送信ボタン -->
        <div class="form-submit">
          <button type="submit">送信する</button>
        </div>

      </form>
    </section>

    <!-- トップページへのリンク -->
    <div class="back-link">
      <a href="index.html">← トップページに戻る</a>
    </div>

  </main>
</body>
</html>
